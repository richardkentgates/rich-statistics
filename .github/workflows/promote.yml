# =============================================================================
# Promote: Merge test → main, tag, and trigger build-release.yml
# Triggered manually when a release candidate on the test branch is verified.
# Uses gh CLI to create a PR (respected by branch protection) then merges.
# =============================================================================
name: Promote to Production

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to tag (e.g. 2.4.14) — leave blank to read from rich-statistics.php'
        required: false
        type: string

jobs:
  promote:
    name: Promote test → main + tag
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout test
        uses: actions/checkout@v4
        with:
          ref: test
          fetch-depth: 0

      - name: Resolve version
        id: version
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            echo "version=${{ inputs.version }}" >> $GITHUB_OUTPUT
          else
            VERSION=$(grep "define( 'RSA_VERSION'" rich-statistics.php | sed "s/.*'\([0-9.]*\)'.*/\1/")
            echo "version=${VERSION}" >> $GITHUB_OUTPUT
          fi

      - name: Create and merge PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PR_URL=$(gh pr create \
            --base main \
            --head test \
            --title "chore: promote v${{ steps.version.outputs.version }} to production" \
            --body "Automated promote workflow. Merges test → main and tags v${{ steps.version.outputs.version }}." \
            --label automate)
          echo "Created PR: $PR_URL"
          gh pr merge "$PR_URL" --squash --delete-branch

      - name: Tag release
        run: |
          git fetch origin main
          git tag "v${{ steps.version.outputs.version }}" origin/main
          git push origin "v${{ steps.version.outputs.version }}"
