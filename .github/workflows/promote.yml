# =============================================================================
# Promote to Production: Release to stable (main) or beta (test branch tag)
# Triggered manually on the test branch when a release candidate is verified.
# =============================================================================
name: Promote to Production

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to tag — leave blank to auto-read from rich-statistics.php'
        required: false
        type: string
      channel:
        description: 'Release channel'
        required: true
        default: 'stable'
        type: choice
        options:
          - stable
          - beta

jobs:
  promote:
    name: Promote ${{ inputs.channel || 'stable' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: write

    steps:
      - name: Checkout test
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: test
          fetch-depth: 0

      - name: Resolve version
        id: version
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            echo "version=${{ inputs.version }}" >> $GITHUB_OUTPUT
          else
            VERSION=$(grep "define( 'RSA_VERSION'" rich-statistics.php | sed "s/.*'\([0-9.]*\)'.*/\1/")
            echo "version=${VERSION}" >> $GITHUB_OUTPUT
          fi

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Stable release — merge test → main + tag
        if: ${{ inputs.channel != 'beta' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # Check if a PR already exists; reuse it if so.
          EXISTING_PR=$(gh pr list --base main --head test --json url --jq '.[0].url' 2>/dev/null || true)
          if [ -n "$EXISTING_PR" ] && [ "$EXISTING_PR" != "null" ]; then
            echo "Reusing existing PR: $EXISTING_PR"
            PR_URL="$EXISTING_PR"
          else
            # Create PR; if one already exists (race), extract its URL from the error.
            PR_OUTPUT=$(gh pr create \
              --base main \
              --head test \
              --title "chore: promote v${{ steps.version.outputs.version }} to production" \
              --body "Automated promote workflow." \
              --label automate 2>&1) || {
              EXISTING_URL=$(echo "$PR_OUTPUT" | grep -oP 'https://github.com/[^/]+/[^/]+/pull/\d+')
              if [ -n "$EXISTING_URL" ]; then
                echo "PR already exists: $EXISTING_URL"
                PR_URL="$EXISTING_URL"
              else
                echo "$PR_OUTPUT"
                exit 1
              fi
            }
            if [ -z "${PR_URL:-}" ]; then
              PR_URL="$PR_OUTPUT"
              echo "Created PR: $PR_URL"
            fi
          fi

          # Wait up to 5 minutes for the PR to become mergeable.
          # This handles the case where test was behind main and needs an update first.
          for _ in $(seq 1 30); do
            MERGE_STATE=$(gh pr view "$PR_URL" --json mergeStateStatus --jq '.mergeStateStatus' 2>/dev/null || echo "UNKNOWN")
            echo "PR merge state: $MERGE_STATE"
            if [ "$MERGE_STATE" = "CLEAN" ] || [ "$MERGE_STATE" = "UNSTABLE" ]; then
              break
            fi
            if [ "$MERGE_STATE" = "BLOCKED" ] || [ "$MERGE_STATE" = "BEHIND" ]; then
              echo "PR not mergeable yet ($MERGE_STATE). Retrying in 10s..."
              sleep 10
              continue
            fi
            if [ "$MERGE_STATE" = "DIRTY" ] || [ "$MERGE_STATE" = "CONFLICTING" ]; then
              echo "ERROR: PR has merge conflicts. Resolve manually."
              exit 1
            fi
            sleep 10
          done

          # Use --merge (not --squash) so history stays connected.
          # If merge fails, fail fast so the tag is not created on an unmerged commit.
          gh pr merge "$PR_URL" --merge

          git fetch origin main
          # Force update the tag — if it already existed from a previous release
          # at the same version, the merge commit replaces it.
          git tag -f "v${{ steps.version.outputs.version }}" origin/main
          git push -f origin "v${{ steps.version.outputs.version }}"
          gh workflow run "Build Release" --ref "v${{ steps.version.outputs.version }}" -f version="${{ steps.version.outputs.version }}"

      - name: Beta release — tag test branch
        if: ${{ inputs.channel == 'beta' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          # Check for existing beta tags to increment the suffix
          EXISTING=$(git tag -l "v${VERSION}-beta.*" | sort -V | tail -1)
          if [ -n "$EXISTING" ]; then
            SUFFIX=${EXISTING##*-beta.}
            NEXT=$((SUFFIX + 1))
            TAG="v${VERSION}-beta.${NEXT}"
          else
            TAG="v${VERSION}-beta.1"
          fi
          git tag "$TAG"
          git push origin "$TAG"
          gh workflow run "Build Release" --ref "$TAG" -f version="${VERSION}"
