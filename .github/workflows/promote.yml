# =============================================================================
# Promote to Production: Release to stable (main) or beta (test branch tag)
# Triggered manually on the test branch when a release candidate is verified.
# =============================================================================
name: Promote to Production

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to tag — leave blank to auto-read from rich-statistics.php'
        required: false
        type: string
      channel:
        description: 'Release channel'
        required: true
        default: 'stable'
        type: choice
        options:
          - stable
          - beta

jobs:
  promote:
    name: Promote ${{ inputs.channel || 'stable' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: write

    steps:
      - name: Checkout test
        uses: actions/checkout@v4
        with:
          ref: test
          fetch-depth: 0

      - name: Resolve version
        id: version
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            echo "version=${{ inputs.version }}" >> $GITHUB_OUTPUT
          else
            VERSION=$(grep "define( 'RSA_VERSION'" rich-statistics.php | sed "s/.*'\([0-9.]*\)'.*/\1/")
            echo "version=${VERSION}" >> $GITHUB_OUTPUT
          fi

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Stable release — merge test → main + tag
        if: ${{ inputs.channel != 'beta' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PR_URL=$(gh pr create \
            --base main \
            --head test \
            --title "chore: promote v${{ steps.version.outputs.version }} to production" \
            --body "Automated promote workflow." \
            --label automate)
          echo "Created PR: $PR_URL"
          # Use --merge (not --squash) so history stays connected
          gh pr merge "$PR_URL" --merge
          git fetch origin main
          git tag "v${{ steps.version.outputs.version }}" origin/main
          git push origin "v${{ steps.version.outputs.version }}"
          gh workflow run "Build Release" --ref "v${{ steps.version.outputs.version }}"

      - name: Beta release — tag test branch
        if: ${{ inputs.channel == 'beta' }}
        run: |
          git tag "v${{ steps.version.outputs.version }}-beta.1"
          git push origin "v${{ steps.version.outputs.version }}-beta.1"
