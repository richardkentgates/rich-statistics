# =============================================================================
# Promote to Production: Merge test → main and tag.
# Triggered manually on the test branch when a release candidate is verified.
#
# Every release ships both stable and beta PWA snapshots (build-release.yml
# creates both automatically). The beta channel is a per-site preference
# set in WordPress admin — not a CI release-time choice.
# =============================================================================
name: Promote to Production

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to tag — leave blank to auto-read from rich-statistics.php'
        required: false
        type: string

jobs:
  promote:
    name: Merge test → main
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout test
        uses: actions/checkout@v4
        with:
          ref: test
          fetch-depth: 0

      - name: Resolve version
        id: version
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            echo "version=${{ inputs.version }}" >> $GITHUB_OUTPUT
          else
            VERSION=$(grep "define( 'RSA_VERSION'" rich-statistics.php | sed "s/.*'\([0-9.]*\)'.*/\1/")
            echo "version=${VERSION}" >> $GITHUB_OUTPUT
          fi

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Merge test → main + tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PR_URL=$(gh pr create \
            --base main \
            --head test \
            --title "chore: promote v${{ steps.version.outputs.version }} to production" \
            --body "Automated promote workflow.")
          echo "Created PR: $PR_URL"
          gh pr merge "$PR_URL" --squash --delete-branch
          git fetch origin main
          git tag "v${{ steps.version.outputs.version }}" origin/main
          git push origin "v${{ steps.version.outputs.version }}"
