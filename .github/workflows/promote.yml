# =============================================================================
# Promote to Production: Merge test → main and tag.
# Triggered manually on the test branch when a release candidate is verified.
#
# Every release ships both stable and beta PWA snapshots (build-release.yml
# creates both automatically). The beta channel is a per-site preference
# set in WordPress admin — not a CI release-time choice.
# =============================================================================
name: Promote to Production

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to tag — leave blank to auto-read from rich-statistics.php'
        required: false
        type: string

jobs:
  promote:
    name: Merge test → main
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Fetch test and resolve version
        id: version
        run: |
          git fetch origin test
          if [ -n "${{ inputs.version }}" ]; then
            echo "version=${{ inputs.version }}" >> $GITHUB_OUTPUT
          else
            VERSION=$(git show origin/test:rich-statistics.php | grep "define( 'RSA_VERSION'" | sed "s/.*'\([0-9.]*\)'.*/\1/")
            echo "version=${VERSION}" >> $GITHUB_OUTPUT
          fi

      - name: Replicate test into main + tag
        run: |
          git fetch origin test
          git rm -rf .
          git checkout origin/test -- .
          git commit -m "chore: promote v${{ steps.version.outputs.version }} to production"
          git push origin main
          git tag "v${{ steps.version.outputs.version }}"
          git push origin "v${{ steps.version.outputs.version }}"
