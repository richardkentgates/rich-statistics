# =============================================================================
# Reusable: Run full test suite (unit + integration)
# Used by: tests.yml, build-develop.yml, build-test.yml, build-release.yml
# =============================================================================
name: Run Tests

on:
  workflow_call:

jobs:
  tests:
    name: Tests (PHP ${{ matrix.php }}, WP ${{ matrix.wp }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: [ '8.1', '8.2', '8.3', '8.4' ]
        wp:  [ 'latest', '6.4' ]
        include:
          # Also run unit tests in the same matrix
          - php: '8.2'
            wp: 'latest'
            suite: 'unit'

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wordpress_tests
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, pdo, pdo_mysql
          coverage: none

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ matrix.php }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ matrix.php }}-

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Setup WordPress test environment
        if: matrix.suite != 'unit'
        env:
          WP_VERSION: ${{ matrix.wp }}
          DB_NAME: wordpress_tests
          DB_USER: root
          DB_PASSWORD: root
          DB_HOST: 127.0.0.1:3306
        run: |
          bash bin/install-wp-tests.sh "$DB_NAME" "$DB_USER" "$DB_PASSWORD" "$DB_HOST" "$WP_VERSION"

      - name: Run unit tests
        if: matrix.suite == 'unit'
        run: php vendor/bin/phpunit --no-coverage --testsuite unit

      - name: Run integration tests
        if: matrix.suite != 'unit'
        env:
          WP_TESTS_DIR: /tmp/wordpress-tests-lib
        run: php vendor/bin/phpunit --no-coverage --testsuite integration

      - name: Run PHPCS
        if: matrix.php == '8.2' && matrix.wp == 'latest'
        run: composer phpcs -- --report-full --runtime-set ignore_warnings_on_exit 1

  ddl:
    name: DDL tests (PHP 8.2, WP latest)
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wordpress_tests
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo, pdo_mysql
          coverage: none

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-8.2-${{ hashFiles('composer.lock') }}
          restore-keys: composer-8.2-

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Setup WordPress test environment
        env:
          WP_VERSION: latest
          DB_NAME: wordpress_tests
          DB_USER: root
          DB_PASSWORD: root
          DB_HOST: 127.0.0.1:3306
        run: bash bin/install-wp-tests.sh "$DB_NAME" "$DB_USER" "$DB_PASSWORD" "$DB_HOST" "$WP_VERSION"

      - name: Run DDL tests
        env:
          WP_TESTS_DIR: /tmp/wordpress-tests-lib
        run: php vendor/bin/phpunit --no-coverage --testsuite ddl
