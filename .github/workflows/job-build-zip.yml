# =============================================================================
# Reusable: Build plugin ZIP + upload artifact
# Used by: build-develop.yml, build-test.yml, build-release.yml
# =============================================================================
name: Build ZIP

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      artifact-name:
        required: true
        type: string
      retention-days:
        required: false
        type: number
        default: 1

jobs:
  build-zip:
    name: Build plugin ZIP
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.2'
          coverage: none

      - name: Verify PHP syntax
        run: |
          find . -name "*.php" \
            -not -path "./vendor/freemius/languages/*" \
            -exec php -l {} +

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Verify Chart.js SRI hash
        run: |
          ACTUAL=$(python3 -c "
          import hashlib, base64
          with open('docs/app/chart.min.js', 'rb') as f:
              digest = hashlib.sha384(f.read()).digest()
              print('sha384-' + base64.b64encode(digest).decode())
          ")
          EXPECTED_FILE="docs/app/chart.sri"
          if [ -f "$EXPECTED_FILE" ]; then
            EXPECTED=$(cat "$EXPECTED_FILE")
            if [ "$ACTUAL" != "$EXPECTED" ]; then
              echo "ERROR: Chart.js SRI hash mismatch!"
              echo "Expected: $EXPECTED"
              echo "Actual:   $ACTUAL"
              echo "To update: regenerate with python3 and commit to docs/app/chart.sri"
              exit 1
            fi
            echo "Chart.js SRI hash verified."
          else
            echo "WARNING: docs/app/chart.sri not found — generating baseline."
            echo "$ACTUAL" > "$EXPECTED_FILE"
            echo "Commit this file to enforce SRI verification on future builds."
          fi

      - name: Run PHPCS
        run: composer phpcs -- --report-full --runtime-set ignore_warnings_on_exit 1

      - name: Create plugin ZIP via build.sh
        run: |
          VERSION="${{ inputs.version }}"
          bash build.sh "$VERSION" --zip-only
          # build.sh creates build/rich-statistics-${VERSION}.zip

      - name: Generate SHA256 checksum
        run: |
          VERSION="${{ inputs.version }}"
          ZIP_NAME="rich-statistics-${VERSION}.zip"
          sha256sum "build/${ZIP_NAME}" > "build/${ZIP_NAME}.sha256"
          cat "build/${ZIP_NAME}.sha256"

      - name: Upload ZIP artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ inputs.artifact-name }}-${{ inputs.version }}
          path: |
            build/rich-statistics-${{ inputs.version }}.zip
            build/rich-statistics-${{ inputs.version }}.zip.sha256
          retention-days: ${{ inputs.retention-days }}
