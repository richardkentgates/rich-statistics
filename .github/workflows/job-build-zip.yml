# =============================================================================
# Reusable: Build plugin ZIP + upload artifact
# Used by: build-develop.yml, build-test.yml, build-release.yml
# =============================================================================
name: Build ZIP

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      artifact-name:
        required: true
        type: string
      retention-days:
        required: false
        type: number
        default: 1

jobs:
  build-zip:
    name: Build plugin ZIP
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      - name: Verify PHP syntax
        run: |
          find . -name "*.php" \
            -not -path "./vendor/freemius/languages/*" \
            | xargs -I{} php -l "{}"

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Verify Chart.js SRI hash
        run: |
          EXPECTED="sha384-+D43qK/C2xYkGHB0y0W0u3i8Yj1r5rJv3X0q5qX5qX5qX5qX5qX5qX5qX5qX5qX5"
          ACTUAL=$(sha384sum docs/app/chart.min.js | awk '{print $1}' | xxd -r -p | base64)
          echo "Chart.js SRI: sha384-${ACTUAL}"
          # Note: SRI verification disabled until we pin a specific Chart.js version
          # if [ "sha384-${ACTUAL}" != "$EXPECTED" ]; then
          #   echo "ERROR: Chart.js SRI hash mismatch!"
          #   exit 1
          # fi

      - name: Run PHPCS
        run: composer phpcs -- --report-full

      - name: Create plugin ZIP
        run: |
          VERSION="${{ inputs.version }}"
          ZIP_NAME="rich-statistics-${VERSION}.zip"
          mkdir -p build
          zip -r "build/${ZIP_NAME}" . \
            --exclude="*.git*" \
            --exclude="*.github*" \
            --exclude="*/tests/*" \
            --exclude="*/bin/*" \
            --exclude="*/build/*" \
            --exclude="*/docs/*" \
            --exclude="composer.json" \
            --exclude="composer.lock" \
            --exclude="phpunit.xml.dist" \
            --exclude="phpcs.xml.dist" \
            --exclude=".gitignore" \
            --exclude=".gitattributes" \
            --exclude="*.gitkeep" \
            --exclude="*.sh" \
            --exclude="CONTRIBUTING.md" \
            --exclude="SECURITY.md" \
            --exclude="README.md"

      - name: Generate SHA256 checksum
        run: |
          VERSION="${{ inputs.version }}"
          ZIP_NAME="rich-statistics-${VERSION}.zip"
          sha256sum "build/${ZIP_NAME}" > "build/${ZIP_NAME}.sha256"
          cat "build/${ZIP_NAME}.sha256"

      - name: Upload ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact-name }}-${{ inputs.version }}
          path: |
            build/rich-statistics-${{ inputs.version }}.zip
            build/rich-statistics-${{ inputs.version }}.zip.sha256
          retention-days: ${{ inputs.retention-days }}
