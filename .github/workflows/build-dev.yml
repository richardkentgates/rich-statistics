name: Build Dev

on:
  push:
    branches:
      - develop
  workflow_dispatch:

jobs:
  build:
    name: Build plugin ZIP
    runs-on: ubuntu-latest
    if: github.event_name == 'push'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version
        id: version
        run: |
          COMMIT_COUNT=$(git rev-list --count HEAD)
          echo "version=dev.${COMMIT_COUNT}" >> $GITHUB_OUTPUT

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      - name: Verify PHP syntax
        run: |
          find . -name "*.php" \
            -not -path "./vendor/freemius/languages/*" \
            | xargs -I{} php -l "{}"

      - name: Create plugin ZIP
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          ZIP_NAME="rich-statistics-${VERSION}.zip"
          mkdir -p build

          zip -r "build/${ZIP_NAME}" . \
            --exclude="*.git*" \
            --exclude="*.github*" \
            --exclude="*/tests/*" \
            --exclude="*/bin/*" \
            --exclude="*/build/*" \
            --exclude="*/docs/*" \
            --exclude="composer.json" \
            --exclude="composer.lock" \
            --exclude="phpunit.xml.dist" \
            --exclude=".gitignore" \
            --exclude=".gitattributes" \
            --exclude="*.gitkeep" \
            --exclude="*.sh" \
            --exclude="CONTRIBUTING.md" \
            --exclude="SECURITY.md" \
            --exclude="README.md"

      - name: Upload ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: rich-statistics-dev-${{ steps.version.outputs.version }}
          path: build/rich-statistics-*.zip
          retention-days: 1

  # ---------------------------------------------------------------------------
  # Build and deploy web app to dev endpoint.
  # Requires secret: DEPLOY_WEBHOOK_TOKEN_DEV
  # ---------------------------------------------------------------------------
  deploy-web-dev:
    name: Deploy web app to dev
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push'
    permissions:
      contents: read

    steps:
      - name: Sync to dev endpoint
        run: |
          curl -fsS -X POST \
            -H "X-Deploy-Token: ${{ secrets.DEPLOY_WEBHOOK_TOKEN_DEV }}" \
            https://rs-app.richardkentgates.com/_deploy-dev/

  # ---------------------------------------------------------------------------
  # Build desktop apps for dev (no deployment, just artifacts)
  # ---------------------------------------------------------------------------
  build-desktop-dev:
    name: Build desktop dev artifacts
    runs-on: ${{ matrix.runner }}
    needs: build
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            platform: linux-amd64
          - runner: ubuntu-24.04-arm
            platform: linux-arm64
          - runner: windows-latest
            platform: windows

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        if: matrix.platform != 'windows'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libssl-dev \
            librsvg2-dev \
            patchelf \
            file

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install Tauri CLI
        run: npm install -g @tauri-apps/cli@^2

      - name: Build .deb (Linux)
        if: matrix.platform != 'windows'
        run: tauri build
        working-directory: src-tauri
        env:
          CI: true

      - name: Build .exe (Windows)
        if: matrix.platform == 'windows'
        run: tauri build
        working-directory: src-tauri
        env:
          CI: true

      - name: Upload Linux artifact
        if: matrix.platform != 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: rich-statistics-dev-${{ matrix.platform }}
          path: src-tauri/target/release/bundle/deb/*.deb
          retention-days: 1

      - name: Upload Windows artifact
        if: matrix.platform == 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: rich-statistics-dev-windows
          path: src-tauri/target/release/bundle/nsis/*.exe
          retention-days: 1

  # ---------------------------------------------------------------------------
  # Run tests on dev branch
  # ---------------------------------------------------------------------------
  test:
    name: Run tests
    runs-on: ubuntu-latest
    if: github.event_name == 'push'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer
          coverage: xdebug

      - name: Install dependencies
        run: |
          composer install --no-interaction --prefer-dist
          composer dump-autoload -o

      - name: Run unit tests
        run: ./vendor/bin/phpunit --testsuite unit || true

      - name: Run integration tests
        run: ./vendor/bin/phpunit --testsuite integration || true