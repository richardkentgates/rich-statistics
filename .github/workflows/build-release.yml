name: Build Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (e.g. 2.2.8) — leave blank to use tag'
        required: false

jobs:
  build-zip:
    uses: ./.github/workflows/job-build-zip.yml
    with:
      version: ${{ github.event.inputs.version || github.ref_name }}
      artifact-name: rich-statistics
      retention-days: 30

  upload-freemius:
    name: Upload ZIP to Freemius
    runs-on: ubuntu-latest
    needs: build-zip
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Download ZIP artifact
        uses: actions/download-artifact@v4
        with:
          name: rich-statistics-${{ github.ref_name }}
          path: build

      - name: Determine channel
        id: channel
        run: |
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#v}"
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          if echo "${{ github.ref_name }}" | grep -q "beta"; then
            echo "is_beta=true" >> $GITHUB_OUTPUT
            echo "release_mode=beta" >> $GITHUB_OUTPUT
          else
            echo "is_beta=false" >> $GITHUB_OUTPUT
            echo "release_mode=pending" >> $GITHUB_OUTPUT
          fi

      - name: Copy ZIP to workspace root
        run: |
          cp "build/rich-statistics-${{ github.ref_name }}.zip" "rich-statistics-${{ github.ref_name }}.zip"

      - name: Upload to Freemius (buttonizer — first-time upload)
        uses: buttonizer/freemius-deploy@v0.1.3
        with:
          file_name: rich-statistics-${{ github.ref_name }}.zip
          release_mode: ${{ steps.channel.outputs.release_mode }}
          version: ${{ steps.channel.outputs.version }}
          sandbox: false
        env:
          PUBLIC_KEY: ${{ secrets.FREEMIUS_PUBLIC_KEY }}
          DEV_ID: ${{ secrets.FREEMIUS_DEV_ID }}
          SECRET_KEY: ${{ secrets.FREEMIUS_SECRET_KEY }}
          PLUGIN_SLUG: rich-statistics
          PLUGIN_ID: 25954

      - name: Promote to released (stable only, if version already existed)
        if: steps.channel.outputs.is_beta == 'false'
        env:
          FREEMIUS_PUBLIC_KEY: ${{ secrets.FREEMIUS_PUBLIC_KEY }}
          FREEMIUS_DEV_ID: ${{ secrets.FREEMIUS_DEV_ID }}
          FREEMIUS_SECRET_KEY: ${{ secrets.FREEMIUS_SECRET_KEY }}
        run: |
          set -euo pipefail
          VERSION="${{ steps.channel.outputs.version }}"
          PLUGIN_ID=25954

          # Developer scope — matching buttonizer/freemius-deploy SDK init.
          # The buttonizer uses the standalone Freemius PHP SDK (freemius-php-sdk),
          # which ALWAYS passes Content-Type: application/json in the string-to-sign
          # for ALL methods (including GET). The WordPress SDK differs on this point.
          # Auth header: FS {scope_entity_id}:{scope_entity_public_key}:{base64url(hmac-sha256)}
          # String to sign: METHOD\\nContent-MD5\\nContent-Type\\nDate\\nResourceUrl

          GET_PATH="/v1/developers/${FREEMIUS_DEV_ID}/plugins/${PLUGIN_ID}/tags.json"
          DATE=$(date -u -R)
          # GET: content-md5 empty, content-type = application/json (standalone SDK always sends it)
          STRING_TO_SIGN="GET\n\napplication/json\n${DATE}\n${GET_PATH}"
          HMAC_BIN=$(echo -en "${STRING_TO_SIGN}" | openssl dgst -sha256 -hmac "${FREEMIUS_SECRET_KEY}" -binary)
          # Base64Url: replace +/ with -_, remove padding =
          HMAC_B64=$(echo -n "${HMAC_BIN}" | base64 | tr '+/' '-_' | tr -d '=')
          AUTH="FS ${FREEMIUS_DEV_ID}:${FREEMIUS_PUBLIC_KEY}:${HMAC_B64}"

          echo "GET ${GET_PATH}?search=${VERSION}"
          RESPONSE=$(curl -sS "https://api.freemius.com${GET_PATH}?search=${VERSION}" \
            -H "Authorization: ${AUTH}" -H "Content-Type: application/json" -H "Date: ${DATE}")
          echo "Response: ${RESPONSE:0:400}"
          TAG_ID=$(echo "${RESPONSE}" | python3 -c "
          import sys,json
          d=json.load(sys.stdin)
          tags=d if isinstance(d,list) else d.get('tags',d.get('data',[]))
          for t in tags:
              if t.get('version')=='${VERSION}':
                  print(t.get('id',''))
                  break
          " 2>/dev/null || true)

          if [ -z "$TAG_ID" ]; then
            echo "Version ${VERSION} not found on Freemius — skipping promote"
            exit 0
          fi

          echo "Found v${VERSION} tag ID ${TAG_ID} — setting release_mode=released"
          # Match PHP json_encode output: no space after colon
          BODY='{"release_mode":"released"}'
          CONTENT_MD5=$(printf '%s' "${BODY}" | md5sum | cut -d' ' -f1)
          PUT_PATH="/v1/developers/${FREEMIUS_DEV_ID}/plugins/${PLUGIN_ID}/tags/${TAG_ID}.json"
          DATE_PUT=$(date -u -R)
          # PUT: content-md5, content-type
          STRING_TO_SIGN_PUT="PUT\n${CONTENT_MD5}\napplication/json\n${DATE_PUT}\n${PUT_PATH}"
          HMAC_BIN_PUT=$(echo -en "${STRING_TO_SIGN_PUT}" | openssl dgst -sha256 -hmac "${FREEMIUS_SECRET_KEY}" -binary)
          HMAC_B64_PUT=$(echo -n "${HMAC_BIN_PUT}" | base64 | tr '+/' '-_' | tr -d '=')
          AUTH_PUT="FS ${FREEMIUS_DEV_ID}:${FREEMIUS_PUBLIC_KEY}:${HMAC_B64_PUT}"

          curl -sS -X PUT "https://api.freemius.com${PUT_PATH}" \
            -H "Authorization: ${AUTH_PUT}" \
            -H "Content-Type: application/json" \
            -H "Content-MD5: ${CONTENT_MD5}" \
            -H "Date: ${DATE_PUT}" \
            -d "${BODY}" \
            | python3 -c "import sys,json;d=json.load(sys.stdin);print(f'Released v{d.get(\"version\",\"\")}: release_mode={d.get(\"release_mode\",\"\")} status={d.get(\"status\",\"\")}')"

  release:
    name: PWA snapshot + GitHub Release
    runs-on: ubuntu-latest
    needs: build-zip
    permissions:
      contents: write
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version
        id: version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "version=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT
          fi

      - name: Download ZIP artifact
        uses: actions/download-artifact@v4
        with:
          name: rich-statistics-${{ github.ref_name }}
          path: build

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/rich-statistics-${{ github.ref_name }}.zip
            build/rich-statistics-${{ github.ref_name }}.zip.sha256
          generate_release_notes: true
          body: |
            ## Rich Statistics ${{ steps.version.outputs.version }}

            See [CHANGELOG.md](CHANGELOG.md) for details.

            ### SHA256 Checksum
            ```
            $(cat build/rich-statistics-${{ github.ref_name }}.zip.sha256)
            ```

            ### Freemius
            Automatically uploaded as a new version via CI.

      - name: Bump SW cache name
        run: |
          # Update the service worker cache name to match the release version.
          # This forces all browsers to invalidate the old cache and fetch fresh assets.
          VERSION="${{ steps.version.outputs.version }}"
          CACHE_NAME="rsa-$(echo "$VERSION" | tr '.' '-')"
          sed -i "s/: 'rsa-[0-9]\+-[0-9]\+-[0-9]\+'/: '${CACHE_NAME}'/" docs/app/sw.js

      - name: Create versioned PWA snapshots (stable + beta)
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          for CHANNEL in stable beta; do
            APP_VERSIONED="docs/app/v/${VERSION}/${CHANNEL}"
            if [ ! -d "$APP_VERSIONED" ]; then
              mkdir -p "$APP_VERSIONED"
              for f in index.html app.js app.css config.js sw.js manifest.json chart.min.js; do
                [ -f "docs/app/${f}" ] && cp "docs/app/${f}" "$APP_VERSIONED/${f}"
              done
              for f in index-dev.html index-test.html config-dev.js config-test.js; do
                [ -f "docs/app/${f}" ] && cp "docs/app/${f}" "$APP_VERSIONED/${f}"
              done
              [ -d "docs/app/icons" ] && cp -r "docs/app/icons" "$APP_VERSIONED/icons"
            fi
          done

      - name: Update versions.json
        run: |
          # Regenerate versions.json from the v/ directory — never manually edit.
          # Lists only stable channel versions.
          python3 << 'PYEOF'
          import json, pathlib
          v_dir = pathlib.Path('docs/app/v')
          versions = sorted(
              [d.name for d in v_dir.iterdir() if d.is_dir()],
              key=lambda x: list(map(int, x.split('.')))
          )
          pathlib.Path('docs/app/versions.json').write_text(json.dumps(versions))
          # Also generate versions-beta.json for the beta channel
          # (pointing to the same version directories — beta snapshots are subdirs)
          pathlib.Path('docs/app/versions-beta.json').write_text(json.dumps(versions))
          PYEOF

      - name: Prune old snapshot directories (keep last 12)
        run: |
          # Keep the 12 most recent versioned snapshots. Older ones are removed
          # from both the v/ directory and versions.json.
          python3 << 'PYEOF'
          import json, shutil, pathlib
          v_dir = pathlib.Path('docs/app/v')
          all_v = sorted(
              [d.name for d in v_dir.iterdir() if d.is_dir()],
              key=lambda x: list(map(int, x.split('.')))
          )
          keep = set(all_v[-12:])
          for d in v_dir.iterdir():
              if d.is_dir() and d.name not in keep:
                  shutil.rmtree(d)
                  print(f"pruned {d}")
          # Regenerate version JSONs from what remains
          remaining = sorted(
              [d.name for d in v_dir.iterdir() if d.is_dir()],
              key=lambda x: list(map(int, x.split('.')))
          )
          pathlib.Path('docs/app/versions.json').write_text(json.dumps(remaining))
          pathlib.Path('docs/app/versions-beta.json').write_text(json.dumps(remaining))
          PYEOF

      - name: Snapshot already committed on develop — CI does not push to any branch
        run: echo "Snapshots are created by build.sh on develop and flow through PR promotion."

  build-desktop:
    uses: ./.github/workflows/job-build-desktop.yml
    needs: release
    if: startsWith(github.ref, 'refs/tags/')
    with:
      target-path: /var/www/rs-app/public_html/dist
      server-host: app.richstatistics.com
      updater-url: https://app.richstatistics.com/dist/update.json
      apt-script: rsa-apt-repo-update
      update-json-script: rsa-gen-update-json
      artifact-prefix: rich-statistics
      stamp-version: true
    secrets: inherit

  ping-deploy:
    name: Deploy PWA to production
    runs-on: ubuntu-latest
    needs: [release, build-desktop]
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Sync docs/app/ via deploy webhook
        run: |
          curl -fsS -X POST \
            -H "X-Deploy-Token: ${{ secrets.DEPLOY_WEBHOOK_TOKEN }}" \
            https://app.richstatistics.com/_deploy/
