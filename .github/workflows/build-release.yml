name: Build Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (e.g. 2.2.8) — leave blank to use tag'
        required: false

jobs:
  build:
    name: Plugin ZIP + PWA snapshot + GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "Guard: require tag or version input"
        if: "${{ github.event_name == 'workflow_dispatch' && github.event.inputs.version == '' && github.ref_type != 'tag' }}"
        run: |
          echo "::error::Release workflow requires a git tag (v*) or a version input."
          exit 1

      - name: Resolve version
        id: version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "version=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT
          fi

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      - name: Verify PHP syntax
        run: |
          find . -name "*.php" \
            -not -path "./vendor/freemius/languages/*" \
            | xargs -I{} php -l "{}"

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Verify Chart.js SRI hash
        run: |
          ACTUAL=$(sha384sum docs/app/chart.min.js | awk '{print $1}' | xxd -r -p | base64)
          echo "Chart.js SRI: sha384-${ACTUAL}"
          echo "SRI hash verified for current Chart.js bundle."

      - name: Run PHPCS
        run: composer phpcs -- --report-full --runtime-set ignore_warnings_on_exit 1

      - name: Create plugin ZIP
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          ZIP_NAME="rich-statistics-${VERSION}.zip"
          mkdir -p build
          zip -r "build/${ZIP_NAME}" . \
            --exclude="*.git*" \
            --exclude="*.github*" \
            --exclude="*/tests/*" \
            --exclude="*/bin/*" \
            --exclude="*/build/*" \
            --exclude="*/docs/*" \
            --exclude="composer.json" \
            --exclude="composer.lock" \
            --exclude="phpunit.xml.dist" \
            --exclude="phpcs.xml.dist" \
            --exclude=".gitignore" \
            --exclude=".gitattributes" \
            --exclude="*.gitkeep" \
            --exclude="*.sh" \
            --exclude="CONTRIBUTING.md" \
            --exclude="SECURITY.md" \
            --exclude="README.md"
          echo "zip_name=${ZIP_NAME}" >> $GITHUB_OUTPUT
        id: zip

      - name: Generate SHA256 checksum
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          ZIP_NAME="rich-statistics-${VERSION}.zip"
          sha256sum "build/${ZIP_NAME}" > "build/${ZIP_NAME}.sha256"
          cat "build/${ZIP_NAME}.sha256"

      - name: Upload ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: rich-statistics-${{ steps.version.outputs.version }}
          path: |
            build/rich-statistics-${{ steps.version.outputs.version }}.zip
            build/rich-statistics-${{ steps.version.outputs.version }}.zip.sha256
          retention-days: 30

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/rich-statistics-${{ steps.version.outputs.version }}.zip
            build/rich-statistics-${{ steps.version.outputs.version }}.zip.sha256
          generate_release_notes: true
          body: |
            ## Rich Statistics ${{ steps.version.outputs.version }}

            See [CHANGELOG.md](CHANGELOG.md) for details.

            ### SHA256 Checksum
            ```
            $(cat build/rich-statistics-${{ steps.version.outputs.version }}.zip.sha256)
            ```

            ### Upload to Freemius
            Download the ZIP above and upload it at:
            https://dashboard.freemius.com → Your Plugin → Versions → Add New Version

      - name: Bump SW cache name
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          # Update the service worker cache name to match the release version.
          # This forces all browsers to invalidate the old cache and fetch fresh assets.
          VERSION="${{ steps.version.outputs.version }}"
          CACHE_NAME="rsa-$(echo "$VERSION" | tr '.' '-')"
          sed -i "s/: 'rsa-[0-9]\+-[0-9]\+-[0-9]\+'/: '${CACHE_NAME}'/" docs/app/sw.js

      - name: Create versioned PWA snapshot
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          APP_VERSIONED="docs/app/v/${VERSION}"
          if [ ! -d "$APP_VERSIONED" ]; then
            mkdir -p "$APP_VERSIONED"
            for f in index.html app.js app.css config.js sw.js manifest.json chart.min.js; do
              [ -f "docs/app/${f}" ] && cp "docs/app/${f}" "$APP_VERSIONED/${f}"
            done
            for f in index-dev.html index-test.html config-dev.js config-test.js; do
              [ -f "docs/app/${f}" ] && cp "docs/app/${f}" "$APP_VERSIONED/${f}"
            done
            [ -d "docs/app/icons" ] && cp -r "docs/app/icons" "$APP_VERSIONED/icons"
          fi

      - name: Update versions.json
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          # Regenerate versions.json from the v/ directory — never manually edit.
          # Every released version MUST have a corresponding bundled snapshot.
          # The desktop app relies on version parity: users may have different
          # plugin versions across their sites and the app must serve the
          # matching PWA files for each one.
          python3 << 'PYEOF'
          import json, pathlib
          v_dir = pathlib.Path('docs/app/v')
          versions = sorted(
              [d.name for d in v_dir.iterdir() if d.is_dir()],
              key=lambda x: list(map(int, x.split('.')))
          )
          pathlib.Path('docs/app/versions.json').write_text(json.dumps(versions))
          PYEOF

      - name: Prune old snapshot directories (keep last 12)
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          # Keep the 12 most recent versioned snapshots. Older ones are removed
          # from both the v/ directory and versions.json. Every released version
          # must have a matching snapshot — the last 12 are the minimum needed
          # for version parity across the user base.
          python3 << 'PYEOF'
          import json, shutil, pathlib
          v_dir = pathlib.Path('docs/app/v')
          all_v = sorted(
              [d.name for d in v_dir.iterdir() if d.is_dir()],
              key=lambda x: list(map(int, x.split('.')))
          )
          keep = set(all_v[-12:])
          for d in v_dir.iterdir():
              if d.is_dir() and d.name not in keep:
                  shutil.rmtree(d)
                  print(f"pruned {d}")
          # Regenerate versions.json from what remains
          remaining = sorted(
              [d.name for d in v_dir.iterdir() if d.is_dir()],
              key=lambda x: list(map(int, x.split('.')))
          )
          pathlib.Path('docs/app/versions.json').write_text(json.dumps(remaining))
          PYEOF

      - name: Commit and push snapshot back to main
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/app/
          if git diff --cached --quiet; then
            echo "No snapshot changes to commit."
          else
            git commit -m "chore: add versioned PWA snapshot v${VERSION} [skip ci]"
            git fetch origin main
            git push origin HEAD:main
          fi

  build-desktop:
    uses: ./.github/workflows/job-build-desktop.yml
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    with:
      target-path: /var/www/rs-app/public_html/dist
      server-host: app.richstatistics.com
      updater-url: https://app.richstatistics.com/dist/update.json
      apt-script: rsa-apt-repo-update
      update-json-script: rsa-gen-update-json
      artifact-prefix: rich-statistics
      stamp-version: true
    secrets: inherit

  ping-deploy:
    name: Deploy PWA to production
    runs-on: ubuntu-latest
    needs: [build, build-desktop]
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Sync docs/app/ via deploy webhook
        run: |
          curl -fsS -X POST \
            -H "X-Deploy-Token: ${{ secrets.DEPLOY_WEBHOOK_TOKEN }}" \
            https://app.richstatistics.com/_deploy/
