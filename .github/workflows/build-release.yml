name: Build Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (e.g. 2.2.8) — leave blank to use tag'
        required: false
      setup_webhook:
        description: 'Set to "true" to bootstrap production webhook on server (one-time)'
        required: false
        default: 'false'

# ─────────────────────────────────────────────────────────────────────────────
# Production release pipeline: triggered by v*.*.* tags on main.
# Builds WordPress plugin ZIP, versioned PWA snapshot, and desktop binaries
# for Linux (amd64 + arm64) and Windows. Pushes all artifacts to:
#   https://rs-app.richardkentgates.com/dist/
#   https://rs-app.richardkentgates.com/v/<version>/
#   https://rs-app.richardkentgates.com/apt/
# ─────────────────────────────────────────────────────────────────────────────

jobs:
  # ── Plugin ZIP + GitHub Release + Versioned PWA Snapshot ────────────────
  build:
    name: Plugin ZIP + PWA snapshot
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version
        id: version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "version=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT
          fi

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      - name: Verify PHP syntax
        run: |
          find . -name "*.php" \
            -not -path "./vendor/freemius/languages/*" \
            | xargs -I{} php -l "{}"

      - name: Create plugin ZIP
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          ZIP_NAME="rich-statistics-${VERSION}.zip"
          mkdir -p build
          zip -r "build/${ZIP_NAME}" . \
            --exclude="*.git*" \
            --exclude="*.github*" \
            --exclude="*/tests/*" \
            --exclude="*/bin/*" \
            --exclude="*/build/*" \
            --exclude="*/docs/*" \
            --exclude="composer.json" \
            --exclude="composer.lock" \
            --exclude="phpunit.xml.dist" \
            --exclude="phpcs.xml.dist" \
            --exclude=".gitignore" \
            --exclude=".gitattributes" \
            --exclude="*.gitkeep" \
            --exclude="*.sh" \
            --exclude="CONTRIBUTING.md" \
            --exclude="SECURITY.md" \
            --exclude="README.md"
          echo "zip_name=${ZIP_NAME}" >> $GITHUB_OUTPUT
        id: zip

      - name: Upload ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: rich-statistics-${{ steps.version.outputs.version }}
          path: build/rich-statistics-${{ steps.version.outputs.version }}.zip
          retention-days: 30

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: build/rich-statistics-${{ steps.version.outputs.version }}.zip
          generate_release_notes: true
          body: |
            ## Rich Statistics ${{ steps.version.outputs.version }}

            See [CHANGELOG.md](CHANGELOG.md) for details.

            ### Upload to Freemius
            Download the ZIP above and upload it at:
            https://dashboard.freemius.com → Your Plugin → Versions → Add New Version

      # ── Versioned PWA Snapshot ──────────────────────────────────────────
      # Snapshot the current PWA files so desktop app users pinned to this
      # version always get matching UI. Stored under docs/app/v/<version>/.
      # Pushed back to main so the server webhook picks it up.
      - name: Create versioned PWA snapshot
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          APP_VERSIONED="docs/app/v/${VERSION}"
          if [ ! -d "$APP_VERSIONED" ]; then
            mkdir -p "$APP_VERSIONED"
            for f in index.html app.js app.css config.js sw.js manifest.json chart.min.js; do
              [ -f "docs/app/${f}" ] && cp "docs/app/${f}" "$APP_VERSIONED/${f}"
            done
            [ -d "docs/app/icons" ] && cp -r "docs/app/icons" "$APP_VERSIONED/icons"
          fi

      - name: Update versions.json
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          python3 -c "import json,pathlib; p=pathlib.Path('docs/app/versions.json'); v=json.loads(p.read_text()); v=sorted(set(v+['${{ steps.version.outputs.version }}']),key=lambda x:list(map(int,x.split('.')))); p.write_text(json.dumps(v))"

      - name: Prune old snapshot directories (keep 3 latest)
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          python3 << 'PYEOF'
          import json, shutil, pathlib

          p = pathlib.Path('docs/app/versions.json')
          all_v = sorted(json.loads(p.read_text()), key=lambda x: list(map(int, x.split('.'))))
          keep = set(all_v[-3:])

          for d in pathlib.Path('docs/app').iterdir():
              if d.is_dir() and d.name.count('.') >= 2 and d.name not in keep:
                  shutil.rmtree(d)
                  print(f"pruned {d}")

          v_dir = pathlib.Path('docs/app/v')
          if v_dir.exists():
              for d in v_dir.iterdir():
                  if d.is_dir() and d.name not in keep:
                      shutil.rmtree(d)
                      print(f"pruned {d}")
          PYEOF

      - name: Commit and push snapshot back to main
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/app/
          if git diff --cached --quiet; then
            echo "No snapshot changes to commit."
          else
            git commit -m "chore: add versioned PWA snapshot v${VERSION} [skip ci]"
            git push origin main
          fi

  # ── Linux Desktop (.deb for amd64 + arm64) ──────────────────────────────
  build-desktop-linux:
    name: Linux desktop (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Stamp version
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          sed -i "s/\"version\": \"[^\"]*\"/\"version\": \"${VERSION}\"/" src-tauri/tauri.conf.json
          sed -i "s/^version = \"[^\"]*\"/version = \"${VERSION}\"/" src-tauri/Cargo.toml

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libssl-dev \
            librsvg2-dev \
            patchelf \
            file

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install Tauri CLI
        run: npm install -g @tauri-apps/cli@^2

      - name: Build .deb
        run: tauri build
        working-directory: src-tauri
        env:
          CI: true
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}

      - name: Patch .desktop in .deb
        run: |
          DEB=$(ls src-tauri/target/release/bundle/deb/*.deb | head -1)
          dpkg-deb -R "${DEB}" /tmp/deb-root
          DESKTOP=$(find /tmp/deb-root -name "*.desktop" | head -1)
          if [ -n "${DESKTOP}" ]; then
            sed -i 's/^Exec=.*/Exec=env WEBKIT_DISABLE_COMPOSITING_MODE=1 rich-statistics/' "${DESKTOP}"
            sed -i 's/^Categories=.*/Categories=Network;/' "${DESKTOP}"
          fi
          dpkg-deb -b /tmp/deb-root "${DEB}"
          rm -rf /tmp/deb-root

      - name: Load SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.APP_SERVER_SSH_KEY }}

      - name: Push .deb and .sig to production server
        run: |
          DEB=$(ls src-tauri/target/release/bundle/deb/*.deb | head -1)
          SIG=$(ls src-tauri/target/release/bundle/deb/*.deb.sig 2>/dev/null | head -1 || true)
          DEST="rich-statistics-linux-${{ matrix.arch }}"
          SSH="ssh -o StrictHostKeyChecking=no -o BatchMode=yes"
          SCP="scp -o StrictHostKeyChecking=no"
          $SSH <SSH_USER>@<PWA_SERVER_IP> "mkdir -p /var/www/rs-app/public_html/dist"
          $SCP "${DEB}" "<SSH_USER>@<PWA_SERVER_IP>:/var/www/rs-app/public_html/dist/${DEST}.deb"
          if [ -n "${SIG}" ]; then
            $SCP "${SIG}" "<SSH_USER>@<PWA_SERVER_IP>:/var/www/rs-app/public_html/dist/${DEST}.deb.sig"
          fi

      - name: Update APT repository
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          SSH="ssh -o StrictHostKeyChecking=no -o BatchMode=yes"
          $SSH <SSH_USER>@<PWA_SERVER_IP> \
            "sudo /usr/local/bin/rsa-apt-repo-update ${{ matrix.arch }} ${VERSION}"

  # ── Windows Desktop (.exe installer via NSIS) ──────────────────────────
  build-desktop-windows:
    name: Windows desktop
    runs-on: windows-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Stamp version
        shell: bash
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          VERSION="${VERSION#v}"
          python bin/stamp-version.py "$VERSION"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install Tauri CLI
        run: npm install -g @tauri-apps/cli@^2

      - name: Build .exe installer
        run: tauri build
        working-directory: src-tauri
        env:
          CI: true
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: rich-statistics-windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.exe.sig
          retention-days: 30

      - name: Load SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.APP_SERVER_SSH_KEY }}

      - name: Push .exe and .sig to production server
        shell: bash
        run: |
          EXE=$(ls src-tauri/target/release/bundle/nsis/*.exe | head -1)
          SIG=$(ls src-tauri/target/release/bundle/nsis/*.exe.sig 2>/dev/null | head -1 || true)
          scp -o StrictHostKeyChecking=no "$EXE" "<SSH_USER>@<PWA_SERVER_IP>:/var/www/rs-app/public_html/dist/"
          if [ -n "${SIG}" ]; then
            scp -o StrictHostKeyChecking=no "$SIG" "<SSH_USER>@<PWA_SERVER_IP>:/var/www/rs-app/public_html/dist/"
          fi

      - name: Regenerate update.json with platform signatures
        shell: bash
        run: |
          ssh -o StrictHostKeyChecking=no <SSH_USER>@<PWA_SERVER_IP> \
            "sudo /usr/local/bin/rsa-gen-update-json ${GITHUB_REF_NAME#v} rs-app.richardkentgates.com /var/www/rs-app/public_html/dist"

  # ── Trigger PWA sync on production server ──────────────────────────────
  ping-deploy:
    name: Deploy PWA to production
    runs-on: ubuntu-latest
    needs: [build, build-desktop-linux, build-desktop-windows]
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Sync docs/app/ via deploy webhook
        run: |
          curl -fsS -X POST \
            -H "X-Deploy-Token: ${{ secrets.DEPLOY_WEBHOOK_TOKEN }}" \
            https://rs-app.richardkentgates.com/_deploy/

  # ── One-time webhook setup (manual trigger only) ───────────────────────
  # This job is only available via workflow_dispatch. It deploys the
  # server-webhook.php and server-update-webapp.sh to the production server
  # so that future releases can use the webhook-based PWA deploy.
  # Run this once after initial server setup:
  #   gh workflow run build-release.yml --ref v2.2.7 -f setup_webhook=true
  setup-webhook:
    name: Setup production webhook
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.setup_webhook == 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Load SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.APP_SERVER_SSH_KEY }}

      - name: Deploy webhook handler and update script
        run: |
          SSH="ssh -o StrictHostKeyChecking=no -o BatchMode=yes"
          SCP="scp -o StrictHostKeyChecking=no"

          # Create _deploy directory and install webhook handler
          $SSH <SSH_USER>@<PWA_SERVER_IP> "sudo mkdir -p /var/www/rs-app/public_html/_deploy"
          $SCP bin/server-webhook.php /tmp/rsa-webhook-index.php
          $SSH <SSH_USER>@<PWA_SERVER_IP> \
            "sudo cp /tmp/rsa-webhook-index.php /var/www/rs-app/public_html/_deploy/index.php && \
             sudo chown www-data:www-data /var/www/rs-app/public_html/_deploy/index.php"

          # Install update script
          $SCP bin/server-update-webapp.sh /tmp/rsa-app-update
          $SSH <SSH_USER>@<PWA_SERVER_IP> \
            "sudo cp /tmp/rsa-app-update /usr/local/bin/rsa-app-update && \
             sudo chmod +x /usr/local/bin/rsa-app-update && \
             echo 'www-data ALL=(ALL) NOPASSWD: /usr/local/bin/rsa-app-update' | \
               sudo tee /etc/sudoers.d/rsa-app-update"

      - name: Reminder to create webhook token
        run: |
          echo "============================================================"
          echo "  WEBHOOK SETUP REQUIRES ONE MORE STEP"
          echo "============================================================"
          echo "  SSH into the server and run:"
          echo ""
          echo "  sudo sh -c 'openssl rand -hex 32 > /etc/rsa-webhook-token'"
          echo "  sudo chmod 640 /etc/rsa-webhook-token"
          echo "  sudo chown root:www-data /etc/rsa-webhook-token"
          echo ""
          echo "  Then add the token as a GitHub secret:"
          echo "  Name:  DEPLOY_WEBHOOK_TOKEN"
          echo "  Value: \$(cat /etc/rsa-webhook-token)"
          echo "============================================================"
