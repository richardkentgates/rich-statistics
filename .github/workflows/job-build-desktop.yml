# =============================================================================
# Reusable: Build desktop binaries (Linux amd64 + arm64 + Windows) and push
# Used by: build-develop.yml, build-test.yml, build-release.yml
# =============================================================================
name: Build Desktop

on:
  workflow_call:
    inputs:
      target-path:
        required: true
        type: string
      server-host:
        required: true
        type: string
      updater-url:
        required: true
        type: string
      apt-script:
        required: true
        type: string
      update-json-script:
        required: true
        type: string
      artifact-prefix:
        required: true
        type: string
      stamp-version:
        required: false
        type: boolean
        default: false

    secrets:
      APP_SERVER_SSH_KEY:
        required: true
      TAURI_SIGNING_PRIVATE_KEY:
        required: true
      TAURI_KEY_PASSWORD:
        required: true

jobs:
  build-desktop:
    name: Desktop (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            platform: linux-amd64
          - runner: ubuntu-24.04-arm
            platform: linux-arm64
          - runner: windows-latest
            platform: windows

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Stamp version (release only)
        if: ${{ inputs.stamp-version }}
        shell: bash
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          sed -i "s/\"version\": \"[^\"]*\"/\"version\": \"${VERSION}\"/" src-tauri/tauri.conf.json
          sed -i "s/^version = \"[^\"]*\"/version = \"${VERSION}\"/" src-tauri/Cargo.toml

      - name: Install system dependencies
        if: matrix.platform != 'windows'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libssl-dev \
            librsvg2-dev \
            patchelf \
            file

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install Tauri CLI
        run: npm install -g @tauri-apps/cli@^2

      - name: Build
        run: tauri build
        working-directory: src-tauri
        env:
          CI: true
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
          TAURI_CONFIG: '{"plugins":{"updater":{"endpoints":["${{ inputs.updater-url }}"]}}}'

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact-prefix }}-${{ matrix.platform }}
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/deb/*.deb.sig
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.exe.sig
          retention-days: 1

      - name: Load SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.APP_SERVER_SSH_KEY }}

      - name: Push binaries
        shell: bash
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          SSH="ssh -o StrictHostKeyChecking=no -o BatchMode=yes"
          SCP="scp -o StrictHostKeyChecking=no"
          $SSH richardkentgates@104.197.231.120 "mkdir -p ${{ inputs.target-path }}"

          echo "Platform: ${PLATFORM}"
          echo "Target: ${{ inputs.target-path }}"

          if [ "${PLATFORM}" = "windows" ]; then
            echo "Contents of nsis dir:"
            ls -la src-tauri/target/release/bundle/nsis/ || echo "(no nsis dir)"
            for f in src-tauri/target/release/bundle/nsis/*.exe src-tauri/target/release/bundle/nsis/*.exe.sig; do
              if [ -f "$f" ]; then
                echo "Pushing: $f"
                $SCP "$f" "richardkentgates@104.197.231.120:${{ inputs.target-path }}/"
              else
                echo "Not found: $f"
              fi
            done
          else
            echo "Contents of deb dir:"
            ls -la src-tauri/target/release/bundle/deb/ || echo "(no deb dir)"
            ARCH=${PLATFORM#linux-}
            DEB=$(ls src-tauri/target/release/bundle/deb/rich-statistics_*.deb 2>/dev/null | head -1 || ls src-tauri/target/release/bundle/deb/*.deb | head -1)
            SIG=$(ls src-tauri/target/release/bundle/deb/*.deb.sig 2>/dev/null | head -1 || true)
            DEST="rich-statistics-linux-${ARCH}"
            echo "DEB=${DEB} SIG=${SIG} DEST=${DEST}"
            if [ -n "${DEB}" ]; then
              $SCP "${DEB}" "richardkentgates@104.197.231.120:${{ inputs.target-path }}/${DEST}.deb"
            else
              echo "ERROR: no .deb file found"
              exit 1
            fi
            if [ -n "${SIG}" ]; then
              $SCP "${SIG}" "richardkentgates@104.197.231.120:${{ inputs.target-path }}/${DEST}.deb.sig"
            fi
          fi

      - name: Update APT repository (Linux only)
        if: matrix.platform != 'windows'
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          ARCH=${PLATFORM#linux-}
          VERSION=$(grep '^version' src-tauri/Cargo.toml | head -1 | sed 's/.*"\(.*\)"/\1/')
          ssh -o StrictHostKeyChecking=no richardkentgates@104.197.231.120 \
            "sudo /usr/local/bin/${{ inputs.apt-script }} ${ARCH} ${VERSION}"

      - name: Regenerate update.json (Windows only)
        if: matrix.platform == 'windows'
        shell: bash
        run: |
          VERSION=$(grep '^version' src-tauri/Cargo.toml | head -1 | sed 's/.*"\(.*\)"/\1/')
          ssh -o StrictHostKeyChecking=no richardkentgates@104.197.231.120 \
            "sudo /usr/local/bin/${{ inputs.update-json-script }} ${VERSION} ${{ inputs.server-host }} ${{ inputs.target-path }}"
