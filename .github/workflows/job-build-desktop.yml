# =============================================================================
# Reusable: Build desktop binaries (Linux amd64 + arm64 + Windows) and push
# Used by: build-develop.yml, build-test.yml, build-release.yml
# =============================================================================
name: Build Desktop

on:
  workflow_call:
    inputs:
      target-path:
        required: true
        type: string
      server-host:
        required: true
        type: string
      updater-url:
        required: true
        type: string
      apt-script:
        required: true
        type: string
      update-json-script:
        required: true
        type: string
      artifact-prefix:
        required: true
        type: string
      stamp-version:
        required: false
        type: boolean
        default: false
      product-suffix:
        required: false
        type: string
        default: ''
      checkout-ref:
        required: false
        type: string
        default: ''
      server-ip:
        required: false
        type: string
        default: '104.197.231.120'
      server-user:
        required: false
        type: string
        default: 'richardkentgates'

    secrets:
      APP_SERVER_SSH_KEY:
        required: true
      TAURI_SIGNING_PRIVATE_KEY:
        required: true
      TAURI_KEY_PASSWORD:
        required: true

jobs:
  build-desktop:
    name: Desktop (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            platform: linux-amd64
          - runner: ubuntu-24.04-arm
            platform: linux-arm64
          - runner: windows-latest
            platform: windows

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.checkout-ref }}

      - name: Stamp version and create PWA snapshot (release only)
        if: ${{ inputs.stamp-version }}
        shell: bash
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          echo "Version: ${VERSION}"

          # Stamp desktop app version.
          sed -i "s/\"version\": \"[^\"]*\"/\"version\": \"${VERSION}\"/" src-tauri/tauri.conf.json
          sed -i "s/^version = \"[^\"]*\"/version = \"${VERSION}\"/" src-tauri/Cargo.toml

          # Create both stable and beta PWA versioned snapshots.
          for CHANNEL in stable beta; do
            APP_VERSIONED="docs/app/v/${VERSION}/${CHANNEL}"
            if [ ! -d "$APP_VERSIONED" ]; then
              mkdir -p "$APP_VERSIONED"
              for f in index.html app.js app.css config.js sw.js manifest.json chart.min.js; do
                [ -f "docs/app/${f}" ] && cp "docs/app/${f}" "$APP_VERSIONED/${f}"
              done
              for f in index-dev.html index-test.html config-dev.js config-test.js; do
                [ -f "docs/app/${f}" ] && cp "docs/app/${f}" "$APP_VERSIONED/${f}"
              done
              [ -d "docs/app/icons" ] && cp -r "docs/app/icons" "$APP_VERSIONED/icons"
            fi
          done

          # Update versions.json.
          python3 -c "import json,pathlib; p=pathlib.Path('docs/app/versions.json'); v=json.loads(p.read_text()); v=sorted(set(v+['${VERSION}']),key=lambda x:list(map(int,x.split('.')))); p.write_text(json.dumps(v))"
          # Update versions-beta.json.
          python3 -c "import json,pathlib; p=pathlib.Path('docs/app/versions-beta.json'); v=json.loads(p.read_text() if p.exists() else '[]'); v=sorted(set(v+['${VERSION}']),key=lambda x:list(map(int,x.split('.')))); p.write_text(json.dumps(v))"
          echo "PWA snapshots (stable + beta) v${VERSION} created for desktop build."

      - name: Install system dependencies
        if: matrix.platform != 'windows'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libssl-dev \
            librsvg2-dev \
            patchelf \
            file

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install Tauri CLI
        run: npm install -g @tauri-apps/cli@^2

      - name: Generate Tauri override config
        id: tauri-config
        shell: bash
        run: |
          python3 -c "import json; print(json.dumps({'productName':'Rich Statistics'+'${{ inputs.product-suffix }}','identifier':'com.richardkentgates.rich-statistics'+'${{ inputs.product-suffix }}','plugins':{'updater':{'endpoints':['${{ inputs.updater-url }}']}}}))" > "${RUNNER_TEMP}/tauri-config.json"
          echo "config=$(cat "${RUNNER_TEMP}/tauri-config.json")" >> "$GITHUB_OUTPUT"

      - name: Build
        run: tauri build
        working-directory: src-tauri
        env:
          CI: true
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
          TAURI_CONFIG: ${{ steps.tauri-config.outputs.config }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact-prefix }}-${{ matrix.platform }}
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/deb/*.deb.sig
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.exe.sig
          retention-days: 1

      - name: Load SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.APP_SERVER_SSH_KEY }}

      - name: Add SSH known hosts
        shell: bash
        run: |
          mkdir -p ~/.ssh
          # Scan the server's host key
          ssh-keyscan -H ${{ inputs.server-ip }} > /tmp/ssh-host-keys
          # Verify fingerprint if expected value is provided
          if [ -n "${{ vars.EXPECTED_HOST_FINGERPRINT }}" ]; then
            ACTUAL=$(ssh-keygen -lf /tmp/ssh-host-keys | head -1 | awk '{print $2}')
            if [ "$ACTUAL" != "${{ vars.EXPECTED_HOST_FINGERPRINT }}" ]; then
              echo "ERROR: Host key fingerprint mismatch!"
              echo "Expected: ${{ vars.EXPECTED_HOST_FINGERPRINT }}"
              echo "Actual:   $ACTUAL"
              exit 1
            fi
            echo "Host key fingerprint verified."
          fi
          cat /tmp/ssh-host-keys >> ~/.ssh/known_hosts
          rm -f /tmp/ssh-host-keys

      - name: Deploy server scripts
        if: matrix.platform == 'linux-amd64'
        shell: bash
        run: |
          SSH="ssh -o BatchMode=yes -o ConnectTimeout=30 -o ServerAliveInterval=15"
          SCP="scp -o BatchMode=yes -o ConnectTimeout=30"
          SERVER="${{ inputs.server-user }}@${{ inputs.server-ip }}"

          max_retries=3
          retry=0
          while [ $retry -lt $max_retries ]; do
            echo "Deploying server scripts (attempt $((retry + 1))/$max_retries)..."
            if $SCP "bin/gen-update-json.py" "${SERVER}:/tmp/gen-update-json.py" && \
               $SCP "bin/server-gen-update-json.sh" "${SERVER}:/tmp/rsa-gen-update-json" && \
               $SCP "bin/server-gen-update-json-dev.sh" "${SERVER}:/tmp/rsa-gen-update-json-dev" && \
               $SCP "bin/server-gen-update-json-test.sh" "${SERVER}:/tmp/rsa-gen-update-json-test" && \
               $SCP "bin/server-apt-repo-update.sh" "${SERVER}:/tmp/rsa-apt-repo-update" && \
               $SSH "$SERVER" "ls -la /tmp/rsa-gen-update-json /tmp/rsa-gen-update-json-dev /tmp/rsa-gen-update-json-test /tmp/gen-update-json.py /tmp/rsa-apt-repo-update && sudo cp /tmp/rsa-gen-update-json /usr/local/bin/ && sudo cp /tmp/rsa-gen-update-json-dev /usr/local/bin/ && sudo cp /tmp/rsa-gen-update-json-test /usr/local/bin/ && sudo cp /tmp/gen-update-json.py /usr/local/bin/ && sudo cp /tmp/rsa-apt-repo-update /usr/local/bin/ && sudo chmod +x /usr/local/bin/rsa-gen-update-json /usr/local/bin/rsa-gen-update-json-dev /usr/local/bin/rsa-gen-update-json-test /usr/local/bin/gen-update-json.py /usr/local/bin/rsa-apt-repo-update && sudo rm /tmp/gen-update-json.py /tmp/rsa-gen-update-json /tmp/rsa-gen-update-json-dev /tmp/rsa-gen-update-json-test /tmp/rsa-apt-repo-update"; then
              echo "Server scripts deployed."
              break
            fi
            retry=$((retry + 1))
            if [ $retry -lt $max_retries ]; then
              echo "Transfer failed, retrying in 10s..."
              sleep 10
            else
              echo "ERROR: Failed to deploy server scripts after $max_retries attempts."
              exit 1
            fi
          done

      - name: Push binaries
        shell: bash
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          SSH="ssh -o BatchMode=yes -o ConnectTimeout=30 -o ServerAliveInterval=15"
          SCP="scp -o BatchMode=yes -o ConnectTimeout=30"
          SERVER="${{ inputs.server-user }}@${{ inputs.server-ip }}"
          max_retries=3
          retry=0

          # Create target directory with retry
          while [ $retry -lt $max_retries ]; do
            if $SSH "$SERVER" "mkdir -p ${{ inputs.target-path }}"; then
              break
            fi
            retry=$((retry + 1))
            [ $retry -lt $max_retries ] && sleep 10 || { echo "ERROR: Failed to create target dir"; exit 1; }
          done

          echo "Platform: ${PLATFORM}"
          echo "Target: ${{ inputs.target-path }}"

          if [ "${PLATFORM}" = "windows" ]; then
            echo "Contents of nsis dir:"
            ls -la src-tauri/target/release/bundle/nsis/ || echo "(no nsis dir)"
            EXE=$(ls src-tauri/target/release/bundle/nsis/*.exe 2>/dev/null | head -1)
            SIG=$(ls src-tauri/target/release/bundle/nsis/*.exe.sig 2>/dev/null | head -1 || true)
            DEST="rich-statistics-windows${{ inputs.product-suffix }}"
            echo "EXE=${EXE} SIG=${SIG} DEST=${DEST}"
            if [ -n "${EXE}" ]; then
              retry=0
              while [ $retry -lt $max_retries ]; do
                if $SCP "${EXE}" "${SERVER}:${{ inputs.target-path }}/${DEST}.exe"; then break; fi
                retry=$((retry + 1))
                [ $retry -lt $max_retries ] && sleep 10 || { echo "ERROR: Failed to upload .exe"; exit 1; }
              done
            else
              echo "ERROR: no .exe file found"
              exit 1
            fi
            if [ -n "${SIG}" ]; then
              retry=0
              while [ $retry -lt $max_retries ]; do
                if $SCP "${SIG}" "${SERVER}:${{ inputs.target-path }}/${DEST}.exe.sig"; then break; fi
                retry=$((retry + 1))
                [ $retry -lt $max_retries ] && sleep 10 || echo "WARNING: Failed to upload .sig"
              done
            else
              echo "WARNING: no .exe.sig file found — update.json will have empty signature"
            fi
          else
            echo "Contents of deb dir:"
            ls -la src-tauri/target/release/bundle/deb/ || echo "(no deb dir)"
            ARCH=${PLATFORM#linux-}
            DEB=$(ls src-tauri/target/release/bundle/deb/rich-statistics_*.deb 2>/dev/null | head -1 || ls src-tauri/target/release/bundle/deb/*.deb | head -1)
            SIG=$(ls src-tauri/target/release/bundle/deb/*.deb.sig 2>/dev/null | head -1 || true)
            DEST="rich-statistics-linux-${ARCH}"
            echo "DEB=${DEB} SIG=${SIG} DEST=${DEST}"
            if [ -n "${DEB}" ]; then
              retry=0
              while [ $retry -lt $max_retries ]; do
                if $SCP "${DEB}" "${SERVER}:${{ inputs.target-path }}/${DEST}.deb"; then break; fi
                retry=$((retry + 1))
                [ $retry -lt $max_retries ] && sleep 10 || { echo "ERROR: Failed to upload .deb"; exit 1; }
              done
            else
              echo "ERROR: no .deb file found"
              exit 1
            fi
            if [ -n "${SIG}" ]; then
              retry=0
              while [ $retry -lt $max_retries ]; do
                if $SCP "${SIG}" "${SERVER}:${{ inputs.target-path }}/${DEST}.deb.sig"; then break; fi
                retry=$((retry + 1))
                [ $retry -lt $max_retries ] && sleep 10 || echo "WARNING: Failed to upload .sig"
              done
            else
              echo "WARNING: no .deb.sig file found — update.json will have empty signature"
            fi
          fi

      - name: Update APT repository (Linux amd64 only)
        # Only update the APT repo once from the amd64 job to avoid race
        # conditions when both Linux builds finish around the same time.
        if: matrix.platform == 'linux-amd64'
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          ARCH=${PLATFORM#linux-}
          VERSION=$(grep '^version' src-tauri/Cargo.toml | head -1 | sed 's/.*"\(.*\)"/\1/')
          SERVER="${{ inputs.server-user }}@${{ inputs.server-ip }}"
          for i in 1 2 3; do
            if ssh -o BatchMode=yes -o ConnectTimeout=30 "$SERVER" \
              "sudo /usr/local/bin/${{ inputs.apt-script }} ${ARCH} ${VERSION}"; then
              break
            fi
            [ "$i" -lt 3 ] && sleep 10 || { echo "ERROR: APT update failed after 3 attempts"; exit 1; }
          done

      - name: Regenerate update.json (Windows only)
        if: matrix.platform == 'windows'
        shell: bash
        run: |
          VERSION=$(grep '^version' src-tauri/Cargo.toml | head -1 | sed 's/.*"\(.*\)"/\1/')
          SERVER="${{ inputs.server-user }}@${{ inputs.server-ip }}"
          for i in 1 2 3; do
            if ssh -o BatchMode=yes -o ConnectTimeout=30 "$SERVER" \
              "sudo /usr/local/bin/${{ inputs.update-json-script }} ${VERSION} ${{ inputs.server-host }} ${{ inputs.target-path }}"; then
              break
            fi
            [ "$i" -lt 3 ] && sleep 10 || { echo "ERROR: update.json regeneration failed after 3 attempts"; exit 1; }
          done
