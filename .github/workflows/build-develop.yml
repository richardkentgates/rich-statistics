name: Build Develop

on:
  push:
    branches: [ develop ]
  workflow_dispatch:

jobs:
  build-zip:
    name: Build plugin ZIP
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version
        id: version
        run: |
          COMMIT_COUNT=$(git rev-list --count HEAD)
          echo "version=dev.${COMMIT_COUNT}" >> $GITHUB_OUTPUT

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      - name: Verify PHP syntax
        run: |
          find . -name "*.php" \
            -not -path "./vendor/freemius/languages/*" \
            | xargs -I{} php -l "{}"

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Run PHPCS
        run: composer phpcs -- --report-full || true

      - name: Create plugin ZIP
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          ZIP_NAME="rich-statistics-${VERSION}.zip"
          mkdir -p build
          zip -r "build/${ZIP_NAME}" . \
            --exclude="*.git*" \
            --exclude="*.github*" \
            --exclude="*/tests/*" \
            --exclude="*/bin/*" \
            --exclude="*/build/*" \
            --exclude="*/docs/*" \
            --exclude="composer.json" \
            --exclude="composer.lock" \
            --exclude="phpunit.xml.dist" \
            --exclude="phpcs.xml.dist" \
            --exclude=".gitignore" \
            --exclude=".gitattributes" \
            --exclude="*.gitkeep" \
            --exclude="*.sh" \
            --exclude="CONTRIBUTING.md" \
            --exclude="SECURITY.md" \
            --exclude="README.md"

      - name: Upload ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: rich-statistics-develop-${{ steps.version.outputs.version }}
          path: build/rich-statistics-*.zip
          retention-days: 1

  deploy-web:
    name: Deploy PWA to dev
    runs-on: ubuntu-latest
    needs: build-zip

    steps:
      - name: Sync docs/app/ via deploy webhook
        run: |
          curl -fsS -X POST \
            -H "X-Deploy-Token: ${{ secrets.DEPLOY_WEBHOOK_TOKEN_DEV }}" \
            https://rs-dev.richardkentgates.com/_deploy/

  build-desktop:
    name: Desktop (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    needs: build-zip
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            platform: linux-amd64
          - runner: ubuntu-24.04-arm
            platform: linux-arm64
          - runner: windows-latest
            platform: windows

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        if: matrix.platform != 'windows'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libssl-dev \
            librsvg2-dev \
            patchelf \
            file

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install Tauri CLI
        run: npm install -g @tauri-apps/cli@^2

      - name: Build
        run: tauri build
        working-directory: src-tauri
        env:
          CI: true
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
          TAURI_CONFIG: '{"plugins":{"updater":{"endpoints":["https://rs-dev.richardkentgates.com/dist/update.json"]}}}'

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: rich-statistics-develop-${{ matrix.platform }}
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/deb/*.deb.sig
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.exe.sig
          retention-days: 1

      - name: Load SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.APP_SERVER_SSH_KEY }}

      - name: Push binaries to dev server
        shell: bash
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          SSH="ssh -o StrictHostKeyChecking=no -o BatchMode=yes"
          SCP="scp -o StrictHostKeyChecking=no"
          $SSH richardkentgates@104.197.231.120 "mkdir -p /var/www/rs-app-dev/dist"

          if [ "${PLATFORM}" = "windows" ]; then
            ls -la src-tauri/target/release/bundle/nsis/ || echo "No nsis dir"
            for f in src-tauri/target/release/bundle/nsis/*.exe src-tauri/target/release/bundle/nsis/*.exe.sig; do
              [ -f "$f" ] && $SCP "$f" "richardkentgates@104.197.231.120:/var/www/rs-app-dev/dist/"
            done
          else
            ARCH=${PLATFORM#linux-}
            echo "Looking for .deb in src-tauri/target/release/bundle/deb/"
            ls -la src-tauri/target/release/bundle/deb/ || echo "No deb dir"
            DEB=$(ls src-tauri/target/release/bundle/deb/rich-statistics_*.deb 2>/dev/null | head -1 || ls src-tauri/target/release/bundle/deb/*.deb | head -1)
            SIG=$(ls src-tauri/target/release/bundle/deb/*.deb.sig 2>/dev/null | head -1 || true)
            DEST="rich-statistics-linux-${ARCH}"
            echo "DEB=${DEB} DEST=${DEST} ARCH=${ARCH}"
            if [ -n "${DEB}" ]; then
              $SCP "${DEB}" "richardkentgates@104.197.231.120:/var/www/rs-app-dev/dist/${DEST}.deb"
            else
              echo "ERROR: no .deb file found"
              exit 1
            fi
            if [ -n "${SIG}" ]; then
              $SCP "${SIG}" "richardkentgates@104.197.231.120:/var/www/rs-app-dev/dist/${DEST}.deb.sig"
            fi
          fi

      - name: Update APT repository (Linux only)
        if: matrix.platform != 'windows'
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          ARCH=${PLATFORM#linux-}
          VERSION=$(grep '^version' src-tauri/Cargo.toml | head -1 | sed 's/.*"\(.*\)"/\1/')
          ssh -o StrictHostKeyChecking=no richardkentgates@104.197.231.120 \
            "sudo /usr/local/bin/rsa-apt-repo-update-dev ${ARCH} ${VERSION}"

      - name: Regenerate update.json (Windows only)
        if: matrix.platform == 'windows'
        shell: bash
        run: |
          VERSION=$(grep '^version' src-tauri/Cargo.toml | head -1 | sed 's/.*"\(.*\)"/\1/')
          ssh -o StrictHostKeyChecking=no richardkentgates@104.197.231.120 \
            "sudo /usr/local/bin/rsa-gen-update-json-dev ${VERSION} rs-dev.richardkentgates.com /var/www/rs-app-dev/dist"
