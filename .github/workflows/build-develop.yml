name: Build Develop

on:
  push:
    branches: [ develop ]
  workflow_dispatch:

jobs:
  build-zip:
    uses: ./.github/workflows/job-build-zip.yml
    with:
      version: dev.${{ github.run_number }}
      artifact-name: rich-statistics-develop
      retention-days: 1

  deploy-web:
    name: Deploy PWA to dev
    runs-on: ubuntu-latest
    needs: build-zip
    steps:
      - name: Sync docs/app/ via deploy webhook
        run: |
          curl -fsS -X POST \
            -H "X-Deploy-Token: ${{ secrets.DEPLOY_WEBHOOK_TOKEN_DEV }}" \
            https://rs-dev.richardkentgates.com/_deploy/

  build-desktop:
    uses: ./.github/workflows/job-build-desktop.yml
    needs: build-zip
    with:
      target-path: /var/www/rs-app-dev/dist
      server-host: rs-dev.richardkentgates.com
      updater-url: https://rs-dev.richardkentgates.com/dist/update.json
      apt-script: rsa-apt-repo-update-dev
      update-json-script: rsa-gen-update-json-dev
      artifact-prefix: rich-statistics-develop
    secrets: inherit
