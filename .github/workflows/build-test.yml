name: Build Test

on:
  workflow_dispatch:

concurrency:
  group: build-test-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tests:
    uses: ./.github/workflows/job-run-tests.yml

  test-premium:
    uses: ./.github/workflows/job-test-premium.yml

  test-multisite:
    uses: ./.github/workflows/job-test-multisite.yml

  test-woocommerce:
    uses: ./.github/workflows/job-test-woocommerce.yml

  build-zip:
    uses: ./.github/workflows/job-build-zip.yml
    needs: [tests, test-premium, test-multisite, test-woocommerce]
    with:
      version: test.${{ github.run_number }}
      artifact-name: rich-statistics-test
      retention-days: 1

  deploy-web:
    name: Deploy PWA to test
    runs-on: ubuntu-latest
    needs: [build-zip, tests, test-premium, test-multisite, test-woocommerce]
    steps:
      - name: Sync docs/app/ via deploy webhook
        run: |
          set -euo pipefail
          max_retries=3
          retry=0
          while [ $retry -lt $max_retries ]; do
            echo "Webhook attempt $((retry + 1))/$max_retries..."
            if curl -fsS -X POST \
              -H "X-Deploy-Token: ${{ secrets.DEPLOY_WEBHOOK_TOKEN_TEST }}" \
              https://test.richstatistics.com/_deploy/; then
              echo "Webhook succeeded."
              break
            fi
            retry=$((retry + 1))
            if [ $retry -lt $max_retries ]; then
              echo "Webhook failed, retrying in 10s..."
              sleep 10
            else
              echo "ERROR: Webhook failed after $max_retries attempts."
              exit 1
            fi
          done

      - name: Smoke test — verify test server is serving PWA
        run: |
          echo "Waiting 5s for deploy to settle..."
          sleep 5
          STATUS=$(curl -fsS -o /dev/null -w "%{http_code}" https://test.richstatistics.com/ || true)
          if [ "$STATUS" = "200" ]; then
            echo "Smoke test passed — test server responding with HTTP 200."
          else
            echo "WARNING: Test server returned HTTP ${STATUS} — deploy may be incomplete."
          fi

  upload-freemius:
    name: Upload to Freemius (Beta)
    runs-on: ubuntu-latest
    needs: [build-zip, tests, test-premium, test-multisite, test-woocommerce]

    steps:
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: curl, json, mbstring

      - name: Checkout (for SDK + deploy script)
        uses: actions/checkout@v4

      - name: Extract version
        id: version
        run: |
          VERSION=$(grep "define( 'RSA_VERSION'" rich-statistics.php | sed "s/.*'\([0-9.]*\)'.*/\1/")
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      - name: Download ZIP artifact
        uses: actions/download-artifact@v4
        with:
          name: rich-statistics-test-test.${{ github.run_number }}
          path: build

      - name: Copy ZIP to workspace root
        run: |
          cp "build/rich-statistics-test.${{ github.run_number }}.zip" \
             "rich-statistics-${{ steps.version.outputs.version }}.zip"

      - name: Deploy to Freemius via SDK
        env:
          DEV_ID: ${{ secrets.FREEMIUS_DEV_ID }}
          PUBLIC_KEY: ${{ secrets.FREEMIUS_PUBLIC_KEY }}
          SECRET_KEY: ${{ secrets.FREEMIUS_SECRET_KEY }}
          PLUGIN_SLUG: rich-statistics
          PLUGIN_ID: 25954
        run: |
          php bin/deploy-freemius.php \
            "rich-statistics-${{ steps.version.outputs.version }}.zip" \
            "${{ steps.version.outputs.version }}" \
            "beta"

  build-desktop:
    uses: ./.github/workflows/job-build-desktop.yml
    needs: [build-zip, tests, test-premium, test-multisite, test-woocommerce]
    with:
      target-path: /var/www/rs-app-test/dist
      server-host: test.richstatistics.com
      updater-url: https://test.richstatistics.com/dist/update.json
      apt-script: rsa-apt-repo-update-test
      update-json-script: rsa-gen-update-json-test
      artifact-prefix: rich-statistics-test
      product-suffix: (Test)
    secrets: inherit
