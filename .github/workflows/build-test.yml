name: Build Test

on:
  push:
    branches: [ test ]
  workflow_dispatch:

jobs:
  build-zip:
    uses: ./.github/workflows/job-build-zip.yml
    with:
      version: test.${{ github.run_number }}
      artifact-name: rich-statistics-test
      retention-days: 1

  deploy-web:
    name: Deploy PWA to test
    runs-on: ubuntu-latest
    needs: build-zip
    steps:
      - name: Sync docs/app/ via deploy webhook
        run: |
          curl -fsS -X POST \
            -H "X-Deploy-Token: ${{ secrets.DEPLOY_WEBHOOK_TOKEN_TEST }}" \
            https://test.richstatistics.com/_deploy/

  build-desktop:
    uses: ./.github/workflows/job-build-desktop.yml
    needs: build-zip
    with:
      target-path: /var/www/rs-app-test/dist
      server-host: test.richstatistics.com
      updater-url: https://test.richstatistics.com/dist/update.json
      apt-script: rsa-apt-repo-update-test
      update-json-script: rsa-gen-update-json-test
      artifact-prefix: rich-statistics-test
      product-suffix: (Test)
    secrets: inherit
