name: Build Test

on:
  push:
    branches: [ test ]
  workflow_dispatch:

jobs:
  build-zip:
    uses: ./.github/workflows/job-build-zip.yml
    with:
      version: test.${{ github.run_number }}
      artifact-name: rich-statistics-test
      retention-days: 1

  deploy-web:
    name: Deploy PWA to test
    runs-on: ubuntu-latest
    needs: build-zip
    steps:
      - name: Sync docs/app/ via deploy webhook
        run: |
          curl -fsS -X POST \
            -H "X-Deploy-Token: ${{ secrets.DEPLOY_WEBHOOK_TOKEN_TEST }}" \
            https://test.richstatistics.com/_deploy/

  upload-freemius:
    name: Upload to Freemius (Beta)
    runs-on: ubuntu-latest
    needs: build-zip

    steps:
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: curl, json, mbstring

      - name: Checkout (for SDK + deploy script)
        uses: actions/checkout@v4

      - name: Extract version
        id: version
        run: |
          VERSION=$(grep "define( 'RSA_VERSION'" rich-statistics.php | sed "s/.*'\([0-9.]*\)'.*/\1/")
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      - name: Download ZIP artifact
        uses: actions/download-artifact@v4
        with:
          name: rich-statistics-test-test.${{ github.run_number }}
          path: build

      - name: Copy ZIP to workspace root
        run: |
          cp "build/rich-statistics-test.${{ github.run_number }}.zip" \
             "rich-statistics-${{ steps.version.outputs.version }}.zip"

      - name: Deploy to Freemius via SDK
        env:
          DEV_ID: ${{ secrets.FREEMIUS_DEV_ID }}
          PUBLIC_KEY: ${{ secrets.FREEMIUS_PUBLIC_KEY }}
          SECRET_KEY: ${{ secrets.FREEMIUS_SECRET_KEY }}
          PLUGIN_SLUG: rich-statistics
          PLUGIN_ID: 25954
        run: |
          php bin/deploy-freemius.php \
            "rich-statistics-${{ steps.version.outputs.version }}.zip" \
            "${{ steps.version.outputs.version }}" \
            "beta"

  build-desktop:
    uses: ./.github/workflows/job-build-desktop.yml
    needs: build-zip
    with:
      target-path: /var/www/rs-app-test/dist
      server-host: test.richstatistics.com
      updater-url: https://test.richstatistics.com/dist/update.json
      apt-script: rsa-apt-repo-update-test
      update-json-script: rsa-gen-update-json-test
      artifact-prefix: rich-statistics-test
      product-suffix: (Test)
    secrets: inherit
