# =============================================================================
# Promote to Test: Sync develop → test
# Triggered manually on the develop branch when code is ready for QA.
# Uses force-push so test always matches develop exactly (avoids squash-merge
# divergence that causes merge conflicts on subsequent promotions).
# =============================================================================
name: Promote to Test

on:
  workflow_dispatch:

jobs:
  promote:
    name: Sync develop → test
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write

    steps:
      - name: Checkout develop
        uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Force-sync test to match develop
        run: |
          git push origin develop:test --force

      - name: Dispatch Build Test
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run "Build Test" --ref test
