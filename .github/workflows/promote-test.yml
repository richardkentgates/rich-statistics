# =============================================================================
# Promote to Test: Merge develop → test
# Triggered manually on the develop branch when code is ready for QA.
# Uses --merge (not --squash) to keep git history connected and avoid
# the branch divergence that caused merge conflicts with squash merges.
# =============================================================================
name: Promote to Test

on:
  workflow_dispatch:

jobs:
  promote:
    name: Merge develop → test
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: write

    steps:
      - name: Checkout develop
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: develop
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Create and merge PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PR_URL=$(gh pr create \
            --base test \
            --head develop \
            --title "chore: promote to test" \
            --body "Automated promote workflow. Merges develop → test for QA." \
            --label automate)
          echo "Created PR: $PR_URL"
          # Use --merge (not --squash) so history stays connected
          gh pr merge "$PR_URL" --merge
          # Push events from GITHUB_TOKEN don't trigger new workflows.
          # Dispatch build-test directly to run CI on the merged test branch.
          gh workflow run "Build Test" --ref test
