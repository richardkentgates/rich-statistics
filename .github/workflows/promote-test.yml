# =============================================================================
# Promote to Test: Merge develop → test
# Triggered manually on the develop branch when code is ready for QA.
# =============================================================================
name: Promote to Test

on:
  workflow_dispatch:

jobs:
  promote:
    name: Merge develop → test
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout develop
        uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Push develop → test
        run: |
          git push --force origin develop:test
