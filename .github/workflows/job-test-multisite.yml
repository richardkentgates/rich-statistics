# =============================================================================
# Reusable: Run tests in multisite mode
# Used by: build-develop.yml, build-test.yml, build-release.yml
# =============================================================================
name: Test Multisite

on:
  workflow_call:

jobs:
  multisite-tests:
    name: Multisite Tests (PHP 8.2, WP latest)
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wordpress_tests
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.2'
          extensions: mbstring, pdo, pdo_mysql
          coverage: none

      - name: Cache Composer dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: vendor
          key: composer-8.2-${{ hashFiles('composer.lock') }}
          restore-keys: composer-8.2-

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Setup WordPress multisite test environment
        env:
          WP_VERSION: latest
          DB_NAME: wordpress_tests
          DB_USER: root
          DB_PASSWORD: root
          DB_HOST: 127.0.0.1:3306
          WP_MULTISITE: '1'
        run: bash bin/install-wp-tests.sh "$DB_NAME" "$DB_USER" "$DB_PASSWORD" "$DB_HOST" "$WP_VERSION"

      - name: Run multisite integration tests
        env:
          WP_TESTS_DIR: /tmp/wordpress-tests-lib
          WP_MULTISITE: '1'
        run: php vendor/bin/phpunit --no-coverage --testsuite integration

      - name: Run DDL tests in multisite
        env:
          WP_TESTS_DIR: /tmp/wordpress-tests-lib
          WP_MULTISITE: '1'
        run: php vendor/bin/phpunit --no-coverage --testsuite ddl
